# Deploy Backend Dev: triggers on push to dev
name: Deploy Backend Dev to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$EC2_SSH_KEY_B64" ]; then
            printf '%s' "$EC2_SSH_KEY_B64" | base64 -d | tr -d '\r' > ~/.ssh/id_rsa
          elif [ -n "$EC2_SSH_KEY" ]; then
            printf '%s' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          else
            echo "Missing EC2_SSH_KEY_B64 or EC2_SSH_KEY secret" >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null

        - name: Deploy on EC2
          env:
            EC2_HOST: ${{ secrets.EC2_HOST }}
            EC2_USER: ${{ secrets.EC2_USER }}
            APP_DIR: ${{ secrets.EC2_APP_DIR }}
            BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
          run: |
            # Clean and prepare remote dir
            ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "${EC2_USER}@${EC2_HOST}" "mkdir -p '${APP_DIR}'"
            
            # Create .env locally on runner and rsync it
            echo "${BACKEND_ENV_B64}" | base64 -d > .env
            rsync -az --delete --exclude '.git' --exclude 'node_modules' -e "ssh -o StrictHostKeyChecking=accept-new" ./ "${EC2_USER}@${EC2_HOST}:${APP_DIR}/"
            
            # Finalize on server
            ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "${EC2_USER}@${EC2_HOST}" '
              set -e
              cd "'"${APP_DIR}"'"
              
              # System setup
              export DEBIAN_FRONTEND=noninteractive
              if ! command -v node >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs
              fi
              command -v pm2 >/dev/null 2>&1 || sudo npm i -g pm2
              command -v docker >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y docker.io)
              command -v nginx >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y nginx)
              
              # Swap
              if ! sudo swapon --show 2>/dev/null | grep -q "/swapfile"; then
                [ ! -f /swapfile ] && (sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none)
                [ -f /swapfile ] && sudo chmod 600 /swapfile && sudo mkswap /swapfile 2>/dev/null && sudo swapon /swapfile 2>/dev/null || true
              fi

              # Nginx
              sudo tee /etc/nginx/sites-available/lumi-ride-dev > /dev/null << "NGINXEOF"
            server {
              listen 80;
              server_name new.lumiride.com;

              location /api/ {
                proxy_pass http://127.0.0.1:4000/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection upgrade;
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
              }
            }
            NGINXEOF
              sudo ln -sf /etc/nginx/sites-available/lumi-ride-dev /etc/nginx/sites-enabled/lumi-ride-dev
              sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
              sudo nginx -t && sudo systemctl reload nginx

              # SSL
              if ! command -v certbot >/dev/null 2>&1; then
                sudo apt-get update -qq && sudo apt-get install -y certbot python3-certbot-nginx
              fi
              sudo certbot --nginx -d new.lumiride.com --non-interactive --agree-tos -m admin@lumiride.com || true

              # Run backend deploy script
              bash scripts/deploy-ec2.sh
            '