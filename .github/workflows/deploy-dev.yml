# Deploy Backend Dev: triggers on push to dev
name: Deploy Backend Dev to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$EC2_SSH_KEY_B64" ]; then
            printf '%s' "$EC2_SSH_KEY_B64" | base64 -d | tr -d '\r' > ~/.ssh/id_rsa
          elif [ -n "$EC2_SSH_KEY" ]; then
            printf '%s' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          else
            echo "Missing EC2_SSH_KEY_B64 or EC2_SSH_KEY secret" >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "${EC2_USER}@${EC2_HOST}" '
            set -e
            mkdir -p "'"${APP_DIR}"'"
            cd "'"${APP_DIR}"'"
            FREE_KB="$(df -Pk . | awk "NR==2 {print \$4}")"
            MIN_FREE_KB=$((2048 * 1024))
            if [ "${FREE_KB}" -lt "${MIN_FREE_KB}" ]; then
              echo "Low disk (${FREE_KB} KB free). Running cleanup before rsync."
              npm cache clean --force >/dev/null 2>&1 || true
              rm -rf ~/.npm/_cacache ~/.cache >/dev/null 2>&1 || true
              pm2 flush >/dev/null 2>&1 || true
              rm -f ~/.pm2/logs/*.log >/dev/null 2>&1 || true
              docker image prune -af >/dev/null 2>&1 || sudo docker image prune -af >/dev/null 2>&1 || true
              sudo journalctl --vacuum-time=3d >/dev/null 2>&1 || true
              sudo apt-get clean >/dev/null 2>&1 || true
              sudo rm -rf /var/lib/apt/lists/* >/dev/null 2>&1 || true
            else
              echo "Disk healthy (${FREE_KB} KB free). Skipping heavy cleanup."
            fi
            df -h
          '
          rsync -az --delete --exclude '.git' --exclude 'node_modules' -e "ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20" ./ "${EC2_USER}@${EC2_HOST}:${APP_DIR}/"
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "${EC2_USER}@${EC2_HOST}" '
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # Swap (prevents OOM)
            if ! sudo swapon --show 2>/dev/null | grep -q swapfile; then
              [ ! -f /swapfile ] && (sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none)
              [ -f /swapfile ] && sudo chmod 600 /swapfile && sudo mkswap /swapfile 2>/dev/null && sudo swapon /swapfile 2>/dev/null || true
              sudo grep -q swapfile /etc/fstab 2>/dev/null || echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab >/dev/null
            fi

            # Node, PM2, Docker
            command -v node >/dev/null 2>&1 || (curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs)
            command -v pm2 >/dev/null 2>&1 || sudo npm i -g pm2
            command -v docker >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y docker.io)
            command -v nginx >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y nginx)
            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get install -y docker-compose >/dev/null 2>&1 || true
            fi

            # Use synced code from runner
            cd "'"${APP_DIR}"'"

            # .env from secret
            if [ -n "'"${BACKEND_ENV_B64}"'" ]; then
              CLEAN_BACKEND_ENV_B64="$(printf '%s' "'"${BACKEND_ENV_B64}"'" | tr -d '\r\n\t ' | tr -cd 'A-Za-z0-9+/=')"
              if ! printf '%s' "${CLEAN_BACKEND_ENV_B64}" | base64 -d > .env 2>/dev/null; then
                printf '%s' "'"${BACKEND_ENV_B64}"'" | tr -d '\r' > .env
              fi
            fi

            # Ensure nginx routes frontend and backend on same EC2
            sudo tee /etc/nginx/sites-available/lumi-ride-dev > /dev/null << "NGINXEOF"
          server {
            listen 80;
            server_name _;

            location /api/ {
              proxy_pass http://127.0.0.1:4000/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection upgrade;
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
            }
          }
          NGINXEOF
            sudo ln -sf /etc/nginx/sites-available/lumi-ride-dev /etc/nginx/sites-enabled/lumi-ride-dev
            sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            sudo nginx -t && sudo systemctl reload nginx

            bash scripts/deploy-ec2.sh
            echo "Backend deploy complete."
          '